; Presence of this file enables the four-player runtime for normal Steam launches.
[FourPlayerCoop]
Enabled=1
; Disable the four optional skill packs only while this mod is active so every peer advertises the base-game DLC mask.
BaseGameDlcCompatibility=1
; Draw a small status dot in the top-left corner: green=fully initialized, red=broken/not ready.
ShowStatusIndicator=1
; Test-only unattended join support. Leave disabled for normal play and public releases.
; BackgroundAutoJoin=1
; AutoJoinPersona=Exact Steam persona
; AutoJoinPollSeconds=5
; AutoJoinSingleCompatibleFallback=0
